    />
    <path d="m209 138 94 34v214l-94-34Z" fill="#f5fbff"/>
    <path d="m303 172 93-34v214l-93 34Z" fill="#eaf7ff"/>
    <path d="M209 138v214M303 172v214" fill="none" stroke="#d8edf8" stroke-width="5" stroke-linecap="round"/>
    <path
      d="M154 313c37-52 77-58 113-32 29 21 58 5 80-54"
      fill="none"
      stroke="#16b8a6"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="154" cy="313" r="15" fill="#16b8a6"/>
    <circle cx="154" cy="313" r="7" fill="#ffffff"/>
  </g>

  <g filter="url(#pinShadow)">
    <path
      d="M348 126c-43 0-77 34-77 76 0 56 77 123 77 123s77-67 77-123c0-42-34-76-77-76Z"
