<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Trip Planner app icon">
  <defs>
    <linearGradient id="sky" x1="72" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="0.55" stop-color="#2f8cf5"/>
      <stop offset="1" stop-color="#6d5dfc"/>
    </linearGradient>
    <radialGradient id="sun" cx="74%" cy="21%" r="42%">
      <stop offset="0" stop-color="#ffd66b" stop-opacity="0.95"/>
      <stop offset="0.36" stop-color="#ffb84d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mapFace" x1="142" y1="142" x2="371" y2="383" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf8ff"/>
    </linearGradient>
    <linearGradient id="pin" x1="324" y1="134" x2="378" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7b5f"/>
      <stop offset="1" stop-color="#f04f73"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1c4f8f" flood-opacity="0.28"/>
    </filter>
    <filter id="pinShadow" x="-35%" y="-25%" width="170%" height="175%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#1f3c72" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#sun)"/>

  <g filter="url(#softShadow)">
    <path
      d="M116 172 209 138l94 34 93-34v214l-93 34-94-34-93 34Z"
