<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Trip Planner app icon">
  <defs>
    <linearGradient id="background" x1="74" y1="52" x2="432" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18d6bd"/>
      <stop offset="0.52" stop-color="#2788f5"/>
      <stop offset="1" stop-color="#7458ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="30%" cy="16%" r="65%">
      <stop offset="0" stop-color="#b7fff2" stop-opacity="0.46"/>
      <stop offset="0.62" stop-color="#b7fff2" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#b7fff2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="78%" cy="24%" r="46%">
      <stop offset="0" stop-color="#ffe087" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffe087" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="destination" x1="342" y1="122" x2="402" y2="242" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#ff4f7b"/>
    </linearGradient>
    <filter id="markShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#153e7a" flood-opacity="0.28"/>
    </filter>
    <filter id="dotShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#153e7a" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#background)"/>
  <rect width="512" height="512" fill="url(#glowA)"/>
  <rect width="512" height="512" fill="url(#glowB)"/>

  <g filter="url(#markShadow)">
    <path
      d="M142 306C186 366 231 382 277 344C319 309 321 247 365 209"
      fill="none"
      stroke="#ffffff"
      stroke-width="48"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <g filter="url(#dotShadow)">
    <circle cx="142" cy="306" r="34" fill="#ffffff"/>
    <circle cx="142" cy="306" r="14" fill="#15b9a7"/>
    <circle cx="365" cy="209" r="58" fill="url(#destination)"/>
    <circle cx="365" cy="209" r="24" fill="#ffffff"/>
    <circle cx="365" cy="209" r="10" fill="#ffcf49"/>
  </g>
</svg>
