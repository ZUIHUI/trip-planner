<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Trip Planner app icon">
  <defs>
    <linearGradient id="background" x1="94" y1="48" x2="405" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58c8ff"/>
      <stop offset="0.48" stop-color="#4387f2"/>
      <stop offset="1" stop-color="#8667f4"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="34%" cy="20%" r="72%">
      <stop offset="0" stop-color="#90dcff" stop-opacity="0.56"/>
      <stop offset="0.55" stop-color="#60b9ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#60b9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="greenPin" x1="356" y1="137" x2="392" y2="213" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfff00"/>
      <stop offset="0.56" stop-color="#9fe400"/>
      <stop offset="1" stop-color="#79c800"/>
    </linearGradient>
    <linearGradient id="starFill" x1="235" y1="164" x2="278" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#eaf4ff"/>
    </linearGradient>
    <filter id="symbolShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#255dca" flood-opacity="0.32"/>
    </filter>
    <filter id="nodeShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#244a95" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#background)"/>
  <rect width="512" height="512" fill="url(#topGlow)"/>

  <g filter="url(#symbolShadow)">
    <path
      d="M309.6 127.4A143 143 0 1 0 368.7 172"
      fill="none"
      stroke="#ffffff"
      stroke-width="31"
      stroke-linecap="round"
    />

    <path
      d="M256 169C267 224 283 240 338 251C283 262 267 278 256 333C245 278 229 262 174 251C229 240 245 224 256 169Z"
      fill="url(#starFill)"
    />
  </g>

  <g filter="url(#nodeShadow)">
    <circle cx="113.3" cy="270" r="34" fill="#ffffff"/>
    <circle cx="275.9" cy="401.6" r="35" fill="#ffffff"/>
    <circle cx="368.7" cy="172" r="43" fill="#ffffff"/>
    <circle cx="368.7" cy="172" r="28" fill="url(#greenPin)"/>
  </g>
